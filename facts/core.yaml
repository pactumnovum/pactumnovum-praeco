#
# Every number the engine publishes must come from this file or from the `facts` table it seeds.
# Each entry has a verbatim quote from its source. Before first use, and whenever `recheck` is true,
# the engine fetches `url` and confirms that `quote` appears on the page (ignoring curly vs straight
# quotes and whitespace). A fact that fails the check is disabled, never edited.
#
# volatile: the number changes often (market values, real-time wealth). Do not use it more than
